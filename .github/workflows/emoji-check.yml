name: Emoji Check
permissions:
  contents: read

on:
  pull_request:

jobs:
  emoji-check:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout code
       uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
       with:
         fetch-depth: 0  # Fetch all history so we can diff against the PR base

     - name: Make script executable
       run: chmod +x scripts/check_emoji.sh

     - name: Check for emojis
       run: scripts/check_emoji.sh ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}